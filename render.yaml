services:
  - type: web
    name: civicconnect-ai-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: APP_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: DB_NAME
        value: civicconnect_ai
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Project Administrator
      - key: FRONTEND_ORIGINS
        sync: false
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_ACCESS_KEY
        sync: false
      - key: DEMO_PASSWORD
        sync: false
